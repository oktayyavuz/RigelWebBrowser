name: Sürüm

# Linux ve Windows paketlerini derler, v<VERSION> etiketli GitHub Sürümü olarak yükler (sürüm varsa dosyaları yeniler).
# Yerelde `scripts/build.sh all` ile aynı adımlar.
# Elle çalıştırılır (Actions › Sürüm › Run workflow); sürümler şimdilik yerelde derlenip yüklenir.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Etiket VERSION ile uyuşuyor mu?
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "Etiket (${GITHUB_REF_NAME}) VERSION dosyasıyla (v$v) uyuşmuyor." >&2
            exit 1
          fi

      - name: Araçlar (7z, wine, squashfs, librsvg)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends p7zip-full wine wine64 squashfs-tools librsvg2-bin xz-utils python3

      - name: Derle (Linux + Windows)
        env:
          RIGEL_APPIMAGE: '1'
        run: scripts/build.sh all

      - name: Sürümü yayımla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t="v$(tr -d '[:space:]' < VERSION)"
          gh release upload "$t" dist/* --clobber 2>/dev/null || gh release create "$t" dist/* \
            --title "Rigel ${t#v}" \
            --notes "Firefox $(tr -d '[:space:]' < FIREFOX_VERSION) (tr) üzerine kurulu Rigel. Özetler: SHA256SUMS."
